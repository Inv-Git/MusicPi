    <symbol id="i-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-smartphone" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
    <symbol id="i-list-music" viewBox="0 0 24 24"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-7.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="m14 10 7-7"/><path d="m3 21 7-7"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></symbol>
    <symbol id="i-trending" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  </svg>
  <div class="app" data-tauri-drag-region>
    <header class="topbar glass" data-tauri-drag-region>
      <button id="back" class="icon-btn" aria-label="Retour" disabled><svg class="ic"><use href="#i-chevron-left"/></svg></button>
      <nav class="tabs">
        <button data-view="music">Musique</button>
        <button data-view="albums">Albums</button>
        <button data-view="folders">Dossiers</button>
        <button data-view="playlists">Playlists</button>
      </nav>
      <label class="search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Rechercher">
      </label>
      <button id="out-btn" class="icon-btn" title="Sortie audio" aria-label="Sortie audio">
        <svg class="ic"><use href="#i-speaker"/></svg>
      </button>
      <button class="icon-btn" data-view="settings" title="Paramètres" aria-label="Paramètres">
        <svg class="ic"><use href="#i-settings"/></svg>
      </button>
      <div class="win-ctrl">
        <button id="win-min" title="Réduire" aria-label="Réduire"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="win-max" title="Agrandir" aria-label="Agrandir"><svg class="ic"><use href="#i-square"/></svg></button>
        <button id="win-close" class="close" title="Fermer" aria-label="Fermer"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div id="out-panel" class="panel" hidden>
        <label>Périphérique
          <select id="device"></select>
        </label>
        <fieldset>
          <legend>Mode</legend>
          <label class="radio"><input type="radio" name="mode" value="shared"> Partagé <small>passe par le mixeur de Windows, volume de Windows actif</small></label>
          <label class="radio"><input type="radio" name="mode" value="exclusive"> Exclusif <small>bit-perfect, ignore le volume de Windows : baisse l'ampli avant</small></label>
        </fieldset>
      </div>
    </header>
    <div id="view" class="view"></div>
  </div>

  <footer class="player glass">
    <div class="now">
      <img id="np-cover" class="np-cover" alt="" hidden>
      <div class="np-text">
        <div id="np-title" class="np-title">Aucune lecture</div>
        <button id="np-artist" class="np-artist link"></button>
      </div>
      <button id="np-like" class="heart np-heart" aria-label="J'aime" title="J'aime" hidden><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>
    <div class="center">
      <div class="transport">
        <button id="shuffle-btn" class="tbtn mode-btn" title="Aléatoire" aria-label="Aléatoire"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button id="prev" class="tbtn" aria-label="Précédent"><svg class="ic solid"><use href="#i-skip-back"/></svg></button>
        <button id="play" class="tbtn main" aria-label="Lecture">
          <svg id="ic-play" class="ic solid"><use href="#i-play"/></svg>
          <svg id="ic-pause" class="ic solid"><use href="#i-pause"/></svg>
        </button>
        <button id="next" class="tbtn" aria-label="Suivant"><svg class="ic solid"><use href="#i-skip-forward"/></svg></button>
        <button id="repeat-btn" class="tbtn mode-btn" title="Fin de la file : s'arrêter" aria-label="Répétition"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="seek">
        <span id="pos" class="time">0:00</span>
        <div class="seek-wrap">
          <span id="loop-band" class="loop-band" hidden></span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
        </div>
        <span id="dur" class="time">0:00</span>
      </div>
    </div>
    <div class="right">
      <div id="signal" class="signal" tabindex="0" hidden>
        <span class="dot"></span><span id="signal-label"></span>
        <div id="signal-tip" class="tip"></div>
      </div>
      <button id="ambient-btn" class="tbtn" title="Mode ambiance (plein écran)" aria-label="Mode ambiance">
        <svg class="ic"><use href="#i-maximize"/></svg>
      </button>
      <button id="practice-btn" class="tbtn" title="Mode travail (ralentir, boucler)" aria-label="Mode travail">
        <svg class="ic"><use href="#i-gauge"/></svg>
      </button>
      <button id="eq-btn" class="tbtn" title="Égaliseur" aria-label="Égaliseur">
        <svg class="ic"><use href="#i-sliders-vertical"/></svg>
      </button>
      <svg id="vol-ic" class="ic vol-ic"><use href="#i-volume-2"/></svg>
      <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
    </div>
    <div id="practice" class="practice" hidden>
      <div class="pr-group">
        <span class="pr-label">Vitesse</span>
        <button class="pr-step" data-tempo-step="-5" aria-label="Plus lent">−</button>
        <input id="tempo" type="range" min="50" max="150" step="1" value="100" aria-label="Vitesse">
        <button class="pr-step" data-tempo-step="5" aria-label="Plus rapide">+</button>
        <button id="tempo-val" class="pr-val" title="Revenir à 100 %">100 %</button>
        <span id="tempo-note" class="hint" hidden>Ajoute bass_fx.dll pour ralentir sans changer la hauteur.</span>
      </div>
      <div class="pr-group">
        <svg class="ic pr-ic"><use href="#i-repeat"/></svg>
        <span class="pr-label">Boucle</span>
        <button id="loop-a" class="pr-mark"><span>Début</span><b>—</b></button>
        <button id="loop-b" class="pr-mark"><span>Fin</span><b>—</b></button>
        <button id="loop-clear" class="pr-step" title="Effacer la boucle" aria-label="Effacer la boucle"><svg class="ic"><use href="#i-x"/></svg></button>
        <span id="loop-keys" class="hint"></span>
      </div>
    </div>
  </footer>

  <div id="eq-panel" class="eq-panel" hidden>
    <div class="eq-head">
      <b>Égaliseur</b>
      <label class="switch" title="Activer l'égaliseur"><input type="checkbox" id="eq-on"><span></span></label>
      <select id="eq-preset" aria-label="Préréglage"></select>
      <button id="eq-reset" class="btn small">Remettre à plat</button>
    </div>
    <div id="eq-bands" class="eq-bands"></div>
    <div class="eq-tools">
      <button id="eq-save" class="btn small">Enregistrer…</button>
      <button id="eq-del" class="btn small" hidden>Supprimer ce préréglage</button>
      <button id="eq-import" class="btn small" title="Fichier ParametricEQ.txt ou GraphicEQ.txt d'autoeq.app">Importer AutoEQ…</button>
      <input id="eq-file" type="file" accept=".txt,text/plain" hidden>
      <label class="chk" title="Le casque et les enceintes gardent chacun leur réglage"><input type="checkbox" id="eq-per-device"> Un réglage par sortie</label>
    </div>
    <div id="eq-save-row" class="eq-tools" hidden>
      <input id="eq-name" class="eq-name" placeholder="Nom du préréglage" maxlength="40" spellcheck="false">
      <button id="eq-name-ok" class="btn small primary">Enregistrer</button>
    </div>
    <p class="hint">Quand il est actif, l'égaliseur modifie le signal : la lecture n'est plus bit-perfect.</p>
  </div>

  <div id="ambient" class="ambient" hidden>
    <div class="amb-bg"><img class="amb-layer" alt=""><img class="amb-layer" alt=""></div>
    <div class="amb-tint"></div>
    <div class="amb-top">
      <button id="amb-close" class="amb-btn" title="Quitter (Échap)" aria-label="Quitter le mode ambiance"><svg class="ic"><use href="#i-minimize"/></svg></button>
      <span id="amb-clock" class="amb-clock"></span>
    </div>
    <div class="amb-main">
      <div class="amb-art"><img id="amb-cover" class="amb-cover" alt=""></div>
      <div class="amb-info">
        <div id="amb-title" class="amb-title"></div>
        <div id="amb-artist" class="amb-artist"></div>
        <div id="amb-album" class="amb-album"></div>
        <div class="amb-progress"><span id="amb-pos">0:00</span><div class="amb-bar"><i id="amb-fill"></i></div><span id="amb-dur">0:00</span></div>
        <div class="amb-ctrl">
          <button class="amb-btn" data-amb="prev" aria-label="Précédent"><svg class="ic solid"><use href="#i-skip-back"/></svg></button>
          <button class="amb-btn main" data-amb="toggle" aria-label="Lecture / pause"><svg class="ic solid"><use id="amb-play-ic" href="#i-pause"/></svg></button>
          <button class="amb-btn" data-amb="next" aria-label="Suivant"><svg class="ic solid"><use href="#i-skip-forward"/></svg></button>
          <button id="amb-like" class="amb-btn heart-amb" data-like-track="" aria-label="J'aime"><svg class="ic"><use href="#i-heart"/></svg></button>
          <div class="amb-vol">
            <svg class="ic"><use id="amb-vol-ic" href="#i-volume-2"/></svg>
            <input id="amb-volume" type="range" min="0" max="100" value="100" aria-label="Volume">
            <span id="amb-vol-val">100</span>
          </div>
        </div>
      </div>
    </div>
    <div id="amb-next" class="amb-next"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
